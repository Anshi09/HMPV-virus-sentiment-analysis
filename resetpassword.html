<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
 </head>
 <body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
   <h2 class="text-2xl font-bold text-center mb-4">Reset Password</h2>
   <form id="resetPasswordForm">
    <div class="mb-4">
     <label class="block text-gray-700 font-medium mb-2" for="email">Enter your email</label>
     <input class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" id="email" placeholder="you@example.com" type="email" required />
    </div>
    <button class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" type="submit">Generate Code</button>
   </form>
   <div id="generatedCode" class="mt-4 text-center hidden">
    <p class="text-gray-700">Your reset code is:</p>
    <p class="text-indigo-600 font-bold text-lg" id="resetCode"></p>
    <button id="redirectToChangePassword" class="mt-4 bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 hidden">
     Go to Change Password
    </button>
   </div>
  </div>
  <script>
    const resetPasswordForm = document.getElementById('resetPasswordForm');
    const generatedCodeDiv = document.getElementById('generatedCode');
    const resetCodeElement = document.getElementById('resetCode');
    const redirectToChangePassword = document.getElementById('redirectToChangePassword');

    resetPasswordForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find((user) => user.email === email);

      if (!user) {
        alert('User does not exist!');
        return;
      }

      // Generate random 8-character alphanumeric code
      const resetCode = Math.random().toString(36).substring(2, 10);
      user.resetCode = resetCode; // Save the reset code in the user object
      localStorage.setItem('users', JSON.stringify(users)); // Update localStorage

      resetCodeElement.textContent = resetCode; // Display the reset code
      generatedCodeDiv.classList.remove('hidden');
      redirectToChangePassword.classList.remove('hidden'); // Show the CTA button
    });

    // Redirect to Change Password page
    redirectToChangePassword.addEventListener('click', () => {
      window.location.href = 'changepassword.html';
    });
  </script>
 </body>
</html>
