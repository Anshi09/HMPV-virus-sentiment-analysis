<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Change Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
 </head>
 <body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
   <h2 class="text-2xl font-bold text-center mb-4">Change Password</h2>
   <form id="changePasswordForm">
    <div class="mb-4">
     <label class="block text-gray-700 font-medium mb-2" for="resetCode">Enter Reset Code</label>
     <input class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" id="resetCode" placeholder="Enter reset code" type="text" required />
    </div>
    <div class="mb-4">
     <label class="block text-gray-700 font-medium mb-2" for="newPassword">New Password</label>
     <input class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" id="newPassword" placeholder="Enter new password" type="password" required />
    </div>
    <div class="mb-4">
     <label class="block text-gray-700 font-medium mb-2" for="confirmPassword">Confirm Password</label>
     <input class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" id="confirmPassword" placeholder="Confirm new password" type="password" required />
    </div>
    <button class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" type="submit">Change Password</button>
   </form>
  </div>
  <script>
   const changePasswordForm = document.getElementById('changePasswordForm');

   changePasswordForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const resetCode = document.getElementById('resetCode').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
     alert('Passwords do not match!');
     return;
    }

    const users = JSON.parse(localStorage.getItem('users')) || [];
    const user = users.find((user) => user.resetCode === resetCode);

    if (!user) {
     alert('Invalid reset code!');
     return;
    }

    user.password = newPassword;
    delete user.resetCode;
    localStorage.setItem('users', JSON.stringify(users));

    alert('Password changed successfully!');
    window.location.href = 'homepage.html';
   });
  </script>
 </body>
</html>
