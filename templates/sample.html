        button {

        .result {

        table {
            width: 100%;

            margin-top: 20px;
        }
        table th, table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;

        table th {

        }
        table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        table tr:hover {

        }
    </style>
</head>

<body class="font-sans">

    <div class="rain">
        <h1 class="text-center text-2xl font-bold mb-4"> Text Sentiment Analysis</h1>
        <textarea id="textInput" rows="6" placeholder="Enter your text here..."></textarea>
        <div class="flex justify-center mt-4">
            <button id="analyzeButton" class="bg-gray-900 text-white px-4 py-2 rounded">Analyze Sentiment</button>

        <table id="jsonTable" style="display: none;">
            <thead>
                <tr>
                    <th>Text</th>
                    <th>Sentiment</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Footer from homepage.html -->
    <footer class="bg-gray-900 text-white py-12 mt-16">
        <div class="rain mx-auto px-4 bg-gray-900">
            <div class="flex flex-col md:flex-row justify-between bg-gray-900">
                <div class="mb-8 md:mb-0 bg-gray-900">
                    <img alt="Logo" class="h-8 w-8 mb-4" height="50" src="https://storage.googleapis.com/a1aa/image/3Y3Gf9rZGUYJaSEDqcZN11FUCjgN-jYgzewtcCRmQ3I.jpg" width="50"/>
                    <p class="text-gray-400 bg-gray-900">
                        © 2025 HMPV Company. All rights reserved.
                    </p>
                </div>
                <div class="flex flex-col md:flex-row space-y-8 md:space-y-0 md:space-x-16">
                    <div>
                        <h4 class="font-semibold mb-4">
                            Product
                        </h4>
                        <ul class="space-y-2">
                            <li>
                                <a class="text-gray-400 hover:text-white" href="#">

                            </li>
                            <li>
                                <a class="text-gray-400 hover:text-white" href="#">

                                </a>
                            </li>
                            <li>
                                <a class="text-gray-400 hover:text-white" href="#">

                            </li>
                        </ul>
                    </div>
                    <div>
                        <h4 class="font-semibold mb-4">
                            Company
                        </h4>
                        <ul class="space-y-2">
                            <li>
                                <a class="text-gray-400 hover:text-white" href="#">
                                    Blog
                                </a>
                            </li>
                            <li>
                                <a class="text-gray-400 hover:text-white" href="#">
                                    Careers

                            </li>
                            <li>
                                <a class="text-gray-400 hover:text-white" href="#">

                            </li>
                        </ul>
                    </div>
                    <div>
                        <h4 class="font-semibold mb-4">
                            Subscribe to Our Newsletter
                        </h4>
                        <form class="flex space-x-2">
                            <input class="px-4 py-2 rounded bg-gray-800 text-white focus:outline-none" placeholder="Enter your email" type="email"/>

    <script>
        // Highlight the active menu link
        const currentPage = window.location.pathname.split('/').pop();
        const menuLinks = document.querySelectorAll('.menu-link');
        menuLinks.forEach((link) => {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('text-blue-600', 'font-bold');
            } else {
                link.classList.remove('text-blue-600', 'font-bold');
            }
        });

        // Logout functionality with confirmation dialog
        const logoutButton = document.getElementById('logoutButton');
        logoutButton.addEventListener('click', () => {
            const confirmLogout = confirm('Are you sure you want to logout?');
            if (confirmLogout) {
                localStorage.removeItem('currentUser');
                window.location.href = 'loginpage.html';
            }
        });

        // Sentiment analysis logic
        document.getElementById("analyzeButton").addEventListener("click", () => {
            const text = document.getElementById("textInput").value;

            document.getElementById("result").innerText = "";
            const table = document.getElementById("jsonTable");
            const tbody = table.querySelector("tbody");
            tbody.innerHTML = "";
            table.style.display = "none";

            if (!text.trim()) {
                document.getElementById("result").innerText = "Please enter some text to analyze.";
                return;
            }

            fetch('/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `text=${encodeURIComponent(text)}`,
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("result").innerText = data.error;
                } else {
                    document.getElementById("result").innerText = "Sentiment analysis completed!";
                    const jsonData = JSON.parse(data.data);
                    jsonData.forEach(item => {
                        const row = document.createElement("tr");
                        const textCell = document.createElement("td");
                        const sentimentCell = document.createElement("td");
                        textCell.textContent = item.Text;
                        sentimentCell.textContent = item.Sentiment;
                        row.appendChild(textCell);
                        row.appendChild(sentimentCell);
                        tbody.appendChild(row);
                    });
                    table.style.display = "table";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("result").innerText = 'An error occurred while analyzing the sentiment.';
            });
        });
    </script>
</body>
