<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
 </head>
 <body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-md mx-auto p-6">
   <div class="text-center mb-8">
    <img alt="Company Logo" class="mx-auto mb-4" height="50" src="https://storage.googleapis.com/a1aa/image/Ey5uJsMkknuShmDpF3Dt4JU9Cr6EICiCFwdxq7SSpuY.jpg" width="100" />
    <h2 class="text-2xl font-bold text-gray-900">Welcome back</h2>
    <p class="text-gray-600">Please sign in to your account</p>
   </div>
   <div class="bg-white p-8 rounded-lg shadow-md">
    <form id="loginForm">
     <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-2" for="email">Email address</label>
      <div class="relative">
       <input class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" id="email" placeholder="you@example.com" type="email" required />
       <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="fas fa-envelope text-gray-400"></i>
       </div>
      </div>
     </div>
     <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-2" for="password">Password</label>
      <div class="relative">
       <input class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" id="password" placeholder="Enter your password" type="password" required />
       <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="fas fa-lock text-gray-400"></i>
       </div>
       <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
        <i id="togglePassword" class="fas fa-eye text-gray-400 cursor-pointer"></i>
       </div>
      </div>
     </div>
     <div class="flex items-center justify-between mb-4">
      <div class="flex items-center">
       <input class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" id="remember" type="checkbox" />
       <label class="ml-2 block text-gray-900" for="remember">Remember me</label>
      </div>
      <div>
       <a class="text-indigo-600 hover:text-indigo-500" href="resetpassword.html">Forgot password?</a>
      </div>
     </div>
     <button class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" type="submit">Sign in</button>
    </form>
   </div>
   <div class="text-center mt-4">
    <p class="text-gray-600">
     Don't have an account?
     <a class="text-indigo-600 hover:text-indigo-500" href="register.html">Sign up now</a>
    </p>
   </div>
  </div>
  <footer class="text-center mt-8 text-gray-600 w-full max-w-md mx-auto">
   <p>© 2025 My Company. All rights reserved.</p>
   <div class="flex justify-center space-x-4 mt-2">
    <a class="hover:underline" href="#">Privacy Policy</a>
    <a class="hover:underline" href="#">Terms of Service</a>
    <a class="hover:underline" href="#">Contact Us</a>
   </div>
  </footer>
  <script>
   // Toggle password visibility
   const togglePassword = document.getElementById('togglePassword');
   const passwordField = document.getElementById('password');
   togglePassword.addEventListener('click', () => {
    const type = passwordField.type === 'password' ? 'text' : 'password';
    passwordField.type = type;
    togglePassword.classList.toggle('fa-eye-slash');
   });

   // Form submission
   const loginForm = document.getElementById('loginForm');
   loginForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Check if user exists
    const users = JSON.parse(localStorage.getItem('users')) || [];
    const user = users.find((user) => user.email === email);

    if (!user) {
     alert('User does not exist!');
     return;
    }

    // Validate password
    if (user.password !== password) {
     alert('Invalid password!');
     return;
    }

    <!-- alert('Login successful!'); -->
    window.location.href = 'homepage.html';
   });
  </script>
 </body>
</html>
