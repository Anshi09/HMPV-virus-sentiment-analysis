<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Create an Account
  </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
 </head>
 <body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
   <div class="text-center mb-6">
    <img alt="Company Logo" class="mx-auto mb-4" height="50" src="https://placehold.co/50x50" width="50"/>
    <h2 class="text-2xl font-bold">
     Create an account
    </h2>
    <p class="text-gray-600">
     Get started with your free account
    </p>
   </div>
   <form id="registerForm">
    <div class="mb-4">
     <label class="block text-gray-700">Full Name</label>
     <div class="relative">
      <i class="fas fa-user absolute left-3 top-3 text-gray-400"></i>
      <input id="fullName" class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="John Doe" type="text" required/>
     </div>
    </div>
    <div class="mb-4">
     <label class="block text-gray-700">Email address</label>
     <div class="relative">
      <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
      <input id="email" class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="you@example.com" type="email" required/>
     </div>
    </div>
    <div class="mb-4">
     <label class="block text-gray-700">Password</label>
     <div class="relative">
      <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
      <input id="password" class="w-full pl-10 pr-10 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Create a password" type="password" required/>
      <i id="togglePassword" class="fas fa-eye absolute right-3 top-3 text-gray-400 cursor-pointer"></i>
     </div>
    </div>
    <div class="mb-4">
     <label class="block text-gray-700">Confirm Password</label>
     <div class="relative">
      <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
      <input id="confirmPassword" class="w-full pl-10 pr-10 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Confirm your password" type="password" required/>
      <i id="toggleConfirmPassword" class="fas fa-eye absolute right-3 top-3 text-gray-400 cursor-pointer"></i>
     </div>
    </div>
    <div class="mb-4">
     <label class="inline-flex items-center">
      <input id="termsCheckbox" class="form-checkbox text-blue-600" type="checkbox" required/>
      <span class="ml-2 text-gray-700">
       I agree to the
       <a class="text-blue-600" href="terms.pdf" target="_blank">Terms of Service</a>
       and
       <a class="text-blue-600" href="privacy.pdf" target="_blank">Privacy Policy</a>
      </span>
     </label>
    </div>
    <div class="mb-6">
     <button class="w-full py-2 px-4 bg-black text-white rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-600" type="submit">
      Create Account
     </button>
    </div>
    <div class="text-center">
     <p class="text-gray-600">
      Already have an account?
      <a class="text-blue-600" href="loginpage.html">Sign in</a>
     </p>
    </div>
   </form>
  </div>
  <footer class="text-center mt-6 w-full max-w-md mx-auto">
   <p class="text-gray-600">© 2024 My Company. All rights reserved.</p>
   <div class="flex justify-center space-x-4 mt-2">
    <a class="text-gray-600 hover:text-blue-600" href="#">Privacy Policy</a>
    <a class="text-gray-600 hover:text-blue-600" href="#">Terms of Service</a>
    <a class="text-gray-600 hover:text-blue-600" href="#">Contact Us</a>
   </div>
  </footer>
  <script>
    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const type = passwordField.type === 'password' ? 'text' : 'password';
      passwordField.type = type;
      togglePassword.classList.toggle('fa-eye-slash');
    });
  
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const confirmPasswordField = document.getElementById('confirmPassword');
    toggleConfirmPassword.addEventListener('click', () => {
      const type = confirmPasswordField.type === 'password' ? 'text' : 'password';
      confirmPasswordField.type = type;
      toggleConfirmPassword.classList.toggle('fa-eye-slash');
    });
  
    // Form submission
    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
  
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
  
      // Custom email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('Please enter a valid email address!');
        return;
      }
  
      // Validate passwords match
      if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }
  
      // Check if user already exists
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const userExists = users.some((user) => user.email === email);
      if (userExists) {
        alert('User already exists with this email!');
        return;
      }
  
      // Save user to localStorage
      users.push({ fullName, email, password });
      localStorage.setItem('users', JSON.stringify(users));
  
      alert('Account created successfully!');
      window.location.href = 'loginpage.html';
    });
  </script>
 </body>
</html>
